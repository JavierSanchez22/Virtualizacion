apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring-fjst
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring-fjst.svc:9090
        isDefault: true
        editable: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring-fjst.svc:3100
        editable: false
        jsonData:
          maxLines: 1000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring-fjst
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: parcial-fjst
        folder: Monitoring FJST
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana-dashboards
