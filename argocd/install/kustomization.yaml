apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Installs Argo CD into its own namespace (argocd-<initials>).
namespace: argocd-fjst

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v2.13.3/manifests/install.yaml
  - ingress.yaml

patches:
  # TLS is not terminated by Argo CD; Traefik serves it over plain HTTP.
  - target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      - op: add
        path: /data
        value:
          server.insecure: "true"
  # Rewrite ClusterRoleBinding subject namespace from default 'argocd' to 'argocd-fjst'
  - target:
      kind: ClusterRoleBinding
      name: argocd-.*
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: argocd-fjst
