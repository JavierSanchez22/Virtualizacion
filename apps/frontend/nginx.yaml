apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app
  namespace: parcial-fjst
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: parcial-fjst
spec:
  selector:
    app: nginx-app
  ports:
  - port: 80
    targetPort: 80
