apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-app
  namespace: parcial-fjst
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpd-app
  template:
    metadata:
      labels:
        app: httpd-app
    spec:
      containers:
      - name: httpd
        image: httpd:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: httpd-service
  namespace: parcial-fjst
spec:
  selector:
    app: httpd-app
  ports:
  - port: 80
    targetPort: 80
