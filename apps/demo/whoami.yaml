apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-app
  namespace: parcial-fjst
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami-app
  template:
    metadata:
      labels:
        app: whoami-app
    spec:
      containers:
      - name: whoami
        image: traefik/whoami
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-service
  namespace: parcial-fjst
spec:
  selector:
    app: whoami-app
  ports:
  - port: 80
    targetPort: 80
