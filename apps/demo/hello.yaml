apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app
  namespace: parcial-fjst
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-app
  template:
    metadata:
      labels:
        app: hello-app
    spec:
      containers:
      - name: hello
        image: nginxdemos/hello:plain-text
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello-service
  namespace: parcial-fjst
spec:
  selector:
    app: hello-app
  ports:
  - port: 80
    targetPort: 80
